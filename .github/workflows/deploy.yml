# Tests every push and pull request; on main, then SSHes into the EC2 host and
# runs deploy/ec2/deploy.sh (build, migrate, restart).
#
# Repository secrets this needs (Settings > Secrets and variables > Actions):
#   EC2_HOST      the instance's Elastic IP
#   EC2_USERNAME  ec2-user (Amazon Linux) or ubuntu
#   EC2_SSH_KEY   full contents of the .pem file
# App secrets live in ~/event-pass-platform/deploy/ec2/.env on the server.
# See README.md for local setup and configuration.
name: Test and deploy

on:
  push:
    branches: [main, 'saas/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway database so the repository tests, the RLS tests and the
    # tenant isolation suite run instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: event_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d event_pass_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EVENT_PASS_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/event_pass_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Apply migrations
        run: DATABASE_URL="$EVENT_PASS_TEST_DATABASE_URL" go run ./cmd/migrate up
      - run: go test ./...

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer push waits rather than cancelling a
    # deploy that is half way through.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Secrets stay in deploy/ec2/.env on the server; GitHub only holds the
      # SSH details. deploy.sh validates the env, runs migrations, then
      # restarts api, worker and caddy.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/event-pass-platform
            git fetch origin main
            git reset --hard origin/main
            bash deploy/ec2/deploy.sh
            domain=$(grep '^APP_DOMAIN=' deploy/ec2/.env | cut -d= -f2)
            curl -fsS --retry 5 --retry-delay 5 "https://$domain/healthz"
