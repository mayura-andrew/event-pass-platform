# DigitalOcean App Platform spec for the NSAC QR API + web apps.
#
# Create the app once with:
#   doctl apps create --spec .do/app.yaml
# or in the control panel (Create App > GitHub > this repo), which detects the
# Dockerfile; then paste the environment variables below.
#
# Values marked type: SECRET are left empty on purpose: set them in the
# control panel (App > Settings > api > Environment Variables > Encrypt).
# Don't commit real secrets to this file. After the first deploy, change
# settings in the control panel rather than re-applying this file, so the
# secrets you entered there aren't touched.
name: nsac-qr
# Bangalore. Pick the Supabase project in Mumbai (ap-south-1) to keep the
# database round trip short.
region: blr

services:
  - name: api
    github:
      repo: ai4all-learn/nsac-qr   # change to your repository
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    # Keep ONE instance: rate limits, the account cache and the live scan
    # feed live in the process's memory.
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10
    routes:
      - path: /
    envs:
      # --- Required secrets (set in the control panel) ---------------------
      # Supabase > Project Settings > Database > Connection string > Session
      # pooler (port 5432). Use the pooler, not the direct db.<ref>.supabase.co
      # host: that one is IPv6-only and App Platform connects over IPv4.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      # openssl rand -hex 32
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET

      # --- Gmail SMTP --------------------------------------------------------
      - key: SMTP_HOST
        scope: RUN_TIME
        value: smtp.gmail.com
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_SECURITY
        scope: RUN_TIME
        value: starttls
      # The full Gmail address that owns the app password.
      - key: SMTP_USERNAME
        scope: RUN_TIME
        type: SECRET
      # 16-character Google app password (spaces removed), NOT the account
      # password: Google Account > Security > 2-Step Verification > App passwords.
      - key: SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # Gmail sends as the signed-in account; use that same address here
      # (or a "Send mail as" alias already verified in Gmail).
      - key: SMTP_FROM
        scope: RUN_TIME
        type: SECRET

      # --- App ---------------------------------------------------------------
      # App Platform fills ${APP_URL} with the app's https:// address. Replace
      # with your own domain once one is attached.
      - key: APP_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: EVENT_NAME
        scope: RUN_TIME
        value: NASA Space Apps Colombo
      # App Platform's edge sets this to the real client IP; without it every
      # request looks like it comes from the load balancer and shares one
      # rate limit.
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: DO-Connecting-IP
      - key: JWT_TTL
        scope: RUN_TIME
        value: 14h
      # Database connections this container may open. Keep it below the
      # Supabase project's pool size (Database Settings > Connection pooling
      # > Pool Size), leaving room for the seed script and the SQL editor.
      - key: DB_MAX_CONNS
        scope: RUN_TIME
        value: "10"
      - key: CHECKIN_SCENARIO_CODE
        scope: RUN_TIME
        value: CHECK_IN
      - key: PUBLIC_DIR
        scope: RUN_TIME
        value: /app/public
      # Optional: venue map on the pass page. Restrict the key to this app's
      # URL (HTTP referrers) in Google Cloud.
      - key: GOOGLE_MAPS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_MAPS_MAP_ID
        scope: RUN_TIME
        value: ""
