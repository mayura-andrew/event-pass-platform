{{define "content"}}
<section class="narrow">
  <h1>Sign in</h1>
  <p class="lede">Use your Google account, or get a one-time link by email. A new address creates an account.</p>
  {{if .Data.Google}}
    <a class="btn btn-block btn-line" href="/auth/google/start{{if .Data.Next}}?next={{.Data.Next}}{{end}}">Sign in with Google</a>
    <div class="divider">or</div>
  {{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{.Data.Email}}">
    </div>
    <button class="btn btn-block" type="submit">Email me a sign-in link</button>
  </form>
</section>
{{end}}
