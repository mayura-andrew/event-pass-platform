services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_pass
      POSTGRES_USER: event_pass
      POSTGRES_PASSWORD: event-pass-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/007_tenancy.sql:/docker-entrypoint-initdb.d/007_tenancy.sql:ro
      - ./migrations/008_events_sharing.sql:/docker-entrypoint-initdb.d/008_events_sharing.sql:ro
      - ./migrations/009_registration.sql:/docker-entrypoint-initdb.d/009_registration.sql:ro
      - ./migrations/010_outbox.sql:/docker-entrypoint-initdb.d/010_outbox.sql:ro
      - ./migrations/011_checkin_workshops.sql:/docker-entrypoint-initdb.d/011_checkin_workshops.sql:ro
      - ./migrations/012_pass_templates.sql:/docker-entrypoint-initdb.d/012_pass_templates.sql:ro
      - ./migrations/013_integrations.sql:/docker-entrypoint-initdb.d/013_integrations.sql:ro
      - ./migrations/014_pass_assets.sql:/docker-entrypoint-initdb.d/014_pass_assets.sql:ro
      - ./migrations/015_participant_profiles.sql:/docker-entrypoint-initdb.d/015_participant_profiles.sql:ro
      - ./migrations/016_birth_dates.sql:/docker-entrypoint-initdb.d/016_birth_dates.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_pass -d event_pass"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://event_pass:event-pass-local-password@db:5432/event_pass?sslmode=disable
      PORT: "8080"
      PUBLIC_DIR: /app/public
      # Local email always goes to Mailpit (http://localhost:8025). These are
      # fixed values, not ${...} defaults, on purpose: Compose would otherwise
      # pull SMTP_* from the developer's shell and send test mail for real.
      APP_BASE_URL: http://localhost:8080
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: Event Pass Platform <no-reply@event-pass.local>
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  # Catches every email the API sends; read them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
