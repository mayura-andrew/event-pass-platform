services:
  - type: web
    name: event-pass-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    preDeployCommand: /app/event-pass-migrate up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: event-pass-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PASS_SIGNING_KEYS
        sync: false
      - key: INTEGRATIONS_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PRODUCT_NAME
        value: Event Pass Platform
      - key: EVENT_NAME
        value: Event Pass
      - key: PUBLIC_DIR
        value: /app/public
      - key: EMAIL_SEND_INTERVAL
        value: 2s
      - key: EMAIL_DAILY_LIMIT
        value: "450"
      - key: DB_MAX_CONNS
        value: "10"

databases:
  - name: event-pass-db
    plan: starter
    databaseName: event_pass
    user: event_pass
